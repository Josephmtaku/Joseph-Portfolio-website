<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Joseph Mtaku</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="download_styles.css" />
  <style>
    body { font-family: 'Lexend Deca', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }

    .page-title { margin: 32px 0 8px; font-size: 40px; line-height: 1.1; }
    .page-subtitle { color: #555; margin-bottom: 28px; }

    .filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 28px; }
    .chip { border: 1px solid #ddd; padding: 8px 14px; border-radius: 999px; background: #fff; cursor: pointer; font-size: 14px; }
    .chip.active { background: #00AEFF; color: #fff; border-color: transparent; }

    .projects-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    @media (max-width: 1024px) { .projects-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 640px)  { .projects-grid { grid-template-columns: 1fr; } }

    .project-card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,.06); display: flex; flex-direction: column; }
    .project-thumb { position: relative; aspect-ratio: 16/9; background: #e9eef3; overflow: hidden; }
    .project-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .project-body { padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    .project-title { margin: 0; font-size: 20px; }
    .project-desc { margin: 0; color: #444; }

    .badge-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .badge { font-size: 12px; background: #f1f5f9; border: 1px solid #e5e7eb; padding: 6px 10px; border-radius: 999px; }

    .meta-row { display: flex; flex-wrap: wrap; gap: 18px; color: #666; font-size: 13px; }

    .actions { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 10px; }
    .btn { display: inline-block; text-decoration: none; padding: 10px 14px; border-radius: 8px; font-weight: 600; }
    .btn-primary { background: #00AEFF; color: #fff; }
    .btn-secondary { background: #000; color: #fff; }
    .btn-ghost { background: #fff; color: #000; border: 1px solid #e5e7eb; }

    .kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #888; }
    details { border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px 12px; background:#fafafa; }
    details summary { cursor: pointer; font-weight: 600; }
    details p, details li { color:#333; }
    details code { background:#f3f4f6; padding:2px 6px; border-radius:6px; }
  </style>
<link rel="stylesheet" href="polish.css">
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <a href="HomePage.html">Home</a>
        <a href="Projects.html" class="active">Projects</a>
        <a href="Skills.html">Skills</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <p class="kicker">Featured</p>
      <h1 class="page-title">Projects</h1>
      <p class="page-subtitle" data-bind="projectsIntro"></p>

      <div id="featured-root"><noscript><p>Please enable JavaScript to see the projects.</p></noscript></div>

      <!-- ===== Filters remain for the rest ===== -->
      <div class="filters" id="filters" role="group" aria-label="Filter projects"></div>

      <section class="projects-grid" id="projectsGrid"></section>

      <br /><br />
      <p class="page-subtitle">Want more detail? <a href="contact.html">get in touch</a>.</p>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>© 2025 Joseph Mtaku</p>
    </div>
  </footer>

  <script src="content.js"></script>
  <script src="classic.js"></script>
</body>
</html>
